name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet restore WindowsAIDoctor.sln
      - run: dotnet build WindowsAIDoctor.sln -c Release --no-restore
      - run: dotnet test WindowsAIDoctor.sln -c Release --no-build
      - run: pwsh scripts/Validate-KnowledgeBase.ps1
      - run: pwsh scripts/Test-AccessibilityNavigation.ps1
      - run: dotnet list WindowsAIDoctor.sln package --vulnerable --include-transitive
      - run: dotnet publish src/WAID.Desktop/WAID.Desktop.csproj -c Release -r win-x64 --self-contained true --no-restore
      - run: dotnet build src/WAID.Desktop/WAID.Desktop.csproj -c Release -p:Platform=ARM64 -r win-arm64
      - uses: gitleaks/gitleaks-action@v2
