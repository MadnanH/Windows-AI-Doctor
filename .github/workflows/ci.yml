name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore WindowsAIDoctor.sln

      - name: Build solution
        run: dotnet build WindowsAIDoctor.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test WindowsAIDoctor.sln -c Release --no-build

      - name: Validate knowledge base
        run: pwsh scripts/Validate-KnowledgeBase.ps1

      - name: Test accessibility navigation
        run: pwsh scripts/Test-AccessibilityNavigation.ps1

      - name: Check vulnerable packages
        run: dotnet list WindowsAIDoctor.sln package --vulnerable --include-transitive

      - name: Publish Windows x64
        run: >
          dotnet publish
          src/WAID.Desktop/WAID.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore

      - name: Build Windows ARM64
        run: >
          dotnet build
          src/WAID.Desktop/WAID.Desktop.csproj
          -c Release
          -p:Platform=ARM64
          -r win-arm64

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
